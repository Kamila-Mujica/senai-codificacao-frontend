<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Minha Loja</h1>
    
    <nav>

            <ul>
                <li><a href="#inicio">Inicio</a></li>
                <li><a href="#produtos">Produtos</a></li>
                <li><a href="#cadastro">Cadastro</a></li>
            </ul>
    </nav>

    <section  id="produtos">

        <h2>Produtos</h2>
            <nav>
                <ul>
                    <li><a href="#masculino">Masculino</a></li>
                    <li><a href="#feminino">Feminino</a></li>
                    <li><a href="#infantil">Infantil</a></li>

                </ul>
            </nav>
    </section>

    <table border="1">
        <caption>Tabela de Preço</caption>
        
        <thead> 

            <tr>
                <th>Produto</th>
                <th>Preço</th>
                <th>Categoria</th>

            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Camiseta</td>
                <td>R$120</td>
                <td>Masculino</td>
            </tr>

            <tr>

                <td>Vestido</td>
                <td>R$90</td>
                <td>Feminino</td>

            </tr>

            <tr>
                <td>Pijama</td>
                <td>R$85</td>
                <td>Infantil</td>
            </tr>
        </tbody>
    
        </table>
<hr>
        <section id="cadastro">

            <h2>Cadastro</h2>

            <form action="clientes/cadastros" method="post">

            <label for="nome">Nome:</label>
            <input type="text" id="nome"  name:nome placeholder="Digite seu nome" required>
            <button type=submit>Enviar</button>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name:email placeholder="Digite seu E-mail" required>
            <button type="submit">Entrar</button>
            
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name:senha placeholder="Digite sua senha" required minlength="8">
            <button type="submit">Entrar</button>

                <br>
                <br>
             <label for="categoria">Categoria de Interesse</label>
             <select name="categoria" id="categoria">
             <option value="masculino">Masculino</option>
             <option value="feminino">Feminino</option>
             <option value="infantil">Infantil</option>
            </select>
            </form>
        </section>

        







</body>
</html>
