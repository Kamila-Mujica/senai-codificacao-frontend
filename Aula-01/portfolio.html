<!DOCTYPE html>
<html lang="pt-br">

  <head>
    <meta charset="UTF-8">
    <title>Cantina do SENAI — Produtos</title>
  </head>

  <body>

    <h1>Cantina do SENAI</h1>
    <p>Confira nossos preços atualizados.</p>

    <!-- Título da seção -->
    <h2>Nossos produtos</h2>

    <!-- Início da tabela -->
    <table border="1">

      <!-- Texto que descreve a tabela -->
      <caption>Tabela de preços — julho/2026</caption>

      <!-- Cabeçalho da tabela -->
      <thead>
        <!-- Linha do cabeçalho -->
        <tr>
          <!-- Título da coluna Produto -->
          <th>Produto</th>

          <!-- Título da coluna Preço -->
          <th>Preço</th>

          <!-- Título da coluna Categoria -->
          <th>Categoria</th>
        </tr>
      </thead>

      <!-- Corpo da tabela (onde ficam os dados) -->
      <tbody>

        <!-- Primeira linha de dados -->
        <tr>
          <!-- Nome do produto -->
          <td>Coxinha</td>

          <!-- Preço do produto -->
          <td>R$ 6,00</td>

          <!-- Categoria do produto -->
          <td>Salgados</td>
        </tr>

        <!-- Segunda linha de dados -->
        <tr>
          <!-- Nome do produto -->
          <td>Pão de queijo</td>

          <!-- Preço do produto -->
          <td>R$ 4,00</td>

          <!-- Categoria do produto -->
          <td>Salgados</td>
        </tr>

        <!-- Terceira linha de dados -->
        <tr>
          <!-- Nome do produto -->
          <td>Refrigerante</td>

          <!-- Preço do produto -->
          <td>R$ 5,00</td>

          <!-- Categoria do produto -->
          <td>Bebidas</td>
        </tr>

      </tbody>

    </table>
    <!-- Fim da tabela -->

  </body>

</html>
