<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 4</title>
</head>

<body>
    <main>
        <h1>Mini Loja</h1>


        <!--Criação da seção de produtos-->
        <section id="produtos">
            <h2>Produtos</h2>

            <article>
                <h2>Smartphone</h2>
                <p>hkgkkvkj</p>

                <h3>Smartphone</h3>
                <img src="img/iphone.jpg"
                    alt="smartphone laranja, com três câmeras traseiras, ao lado da tela preta com linhas abstratas em tons de laranja."
                    width="250" height="250" loading="lazy">
            </article>

            <article>
                <h2>Camiseta</h2>
                <p>kgjclhklhi</p>

                <h3>Camiseta</h3>

                <figure>

                    <img src="img/camisa.jpg"
                        alt="camiseta branca de manga curta e gola redonda, apresentada sobre fundo branco." width="250"
                        height="250" loading="lazy">
                    <figcaption>Camiseta Branca - R$59,90 </figcaption>
            </article>
            </figure>

        </section>

        <section>

            <h3>Video do Produto</h3>

            <video controls width="400" preload="metadata" tittle="Video do Produto" loading="lazy">

                <source src="img/video.mp4" type="video/mp4">

            </video>

        </section>

        <section>
            <h3>Descrição em áudio</h3>
            <audio controls preload="metadata">
            <source src="img/descrição-do-audio.mp3" type="audio.mpeg">
            </audio>
        </section>

        <section id="Conteudo Externo">
            <h3>Conteúdo Externo</h3>
            <iframe src="https://www.youtube.com/embed/cJSzs97B9wo?si=wXx19xE0aY8N7_CN" width="400" height="255"
                title="Video externo sobre moda" loading="lazy" allowfullscreen></iframe>
        </section>

        <!--<img src=img/camisa.jpg alt="produto"></img>-->
        <img src="img/camisa.jpg" alt="camiseta branca de manga curta e gola redonda, apresentada sobre fundo branco."
            height="250" width="250" loading="lazy">

        <!--<video width="400">
        <source src="img/video.mp4">
        </video>-->

        <video width="400" preload="metadata"
            title="Video do Produto"
            loading="lazy">

            <source src="img/video.mp4" type="video/mp4">

        </video>

        <footer>
            <p>Desenvolvido por:Valentina e Valentina </p>
        </footer>
